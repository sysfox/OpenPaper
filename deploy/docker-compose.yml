# 首次启动：复制 deploy/.env.example 为 deploy/.env，执行 docker compose -f deploy/docker-compose.yml up -d --build
# 启用 pg_trgm：首次启动后执行 docker compose -f deploy/docker-compose.yml exec db psql -U ${POSTGRES_USER:-openpaper} ${POSTGRES_DB:-openpaper} -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
# 备份：docker compose -f deploy/docker-compose.yml exec db pg_dump -U ${POSTGRES_USER:-openpaper} ${POSTGRES_DB:-openpaper} | gzip > backup-$(date +%F).sql.gz
# 恢复：gunzip -c backup-*.sql.gz | docker compose -f deploy/docker-compose.yml exec -T db psql -U ${POSTGRES_USER:-openpaper} ${POSTGRES_DB:-openpaper}
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openpaper}
      POSTGRES_USER: ${POSTGRES_USER:-openpaper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openpaper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openpaper}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-openpaper}:${POSTGRES_PASSWORD:-openpaper}@db:5432/${POSTGRES_DB:-openpaper}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
